<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="root@wog neon HUD terminal: whoami, stack, status, contacts">
  <defs>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .cmd  { fill: #e8f6ff; font-size: 17px; }
      .out  { fill: #7fdcff; font-size: 17px; }
      .ok   { fill: #00ff88; font-size: 17px; }
      .hl   { fill: #ff3e81; font-size: 17px; }
      .ps1  { fill: #00e5ff; font-size: 17px; }
      .bar  { fill: #456; font-size: 11px; letter-spacing: 2px; }
      .geo  { fill: #2a6b7a; font-size: 11px; letter-spacing: 1px; }
      .ctx  { fill: #00e5ff; font-size: 13px; letter-spacing: 1px; }
      .line { opacity: 0; }
      .neon { stroke: #00e5ff; fill: none; stroke-width: 1.5; }
    </style>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#0c1820" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#9be8ff" opacity="0.022"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="6" y="6" width="868" height="288" rx="10" fill="#07090d" stroke="#16414f" stroke-width="1.5"/>
  <rect x="7" y="47" width="866" height="246" fill="url(#grid)"/>
  <rect x="7" y="47" width="866" height="246" fill="url(#scan)"/>

  <!-- HUD corner brackets -->
  <path class="neon" d="M 22 22 h 18 M 22 22 v 18" opacity="0.85"/>
  <path class="neon" d="M 858 22 h -18 M 858 22 v 18" opacity="0.85"/>
  <path class="neon" d="M 22 278 h 18 M 22 278 v -18" opacity="0.85"/>
  <path class="neon" d="M 858 278 h -18 M 858 278 v -18" opacity="0.85"/>

  <!-- title bar -->
  <circle cx="32" cy="26" r="5" fill="#ff3e3e" filter="url(#glow)"/>
  <circle cx="52" cy="26" r="5" fill="#ffd23e"/>
  <circle cx="72" cy="26" r="5" fill="#00ff88" filter="url(#glow)"/>
  <text class="bar" x="440" y="30" text-anchor="middle">ROOT@WOG:~/SESSION — ZSH</text>
  <text class="geo" x="820" y="30" text-anchor="end">43.23N 76.88E</text>
  <line x1="16" y1="46" x2="864" y2="46" stroke="#16414f" stroke-width="1.5"/>

  <!-- session -->
  <g>
    <text class="line" x="34" y="82"><tspan class="ps1" filter="url(#glow)">$ </tspan><tspan class="cmd">whoami</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line out" x="46" y="108">senior backend engineer · ALMATY, KZ
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line" x="34" y="142"><tspan class="ps1" filter="url(#glow)">$ </tspan><tspan class="cmd">cat stack.txt</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line out" x="46" y="168">python · django · fastapi · go · ts · c++
      <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line" x="34" y="202"><tspan class="ps1" filter="url(#glow)">$ </tspan><tspan class="cmd">status --now</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line hl" x="46" y="228" filter="url(#glow)">building SHARD → shard.team
      <animate attributeName="opacity" from="0" to="1" begin="5.3s" dur="0.15s" fill="freeze"/></text>
    <rect x="326" y="214" width="10" height="18" fill="#00e5ff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- contacts strip -->
  <line x1="24" y1="252" x2="856" y2="252" stroke="#16414f" stroke-width="1.5" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" from="0" to="11" dur="0.7s" repeatCount="indefinite"/>
  </line>
  <g>
    <circle class="neon" cx="40" cy="274" r="7" opacity="0.9"/>
    <line class="neon" x1="33" y1="274" x2="47" y2="274" opacity="0.9"/>
    <ellipse class="neon" cx="40" cy="274" rx="3" ry="7" opacity="0.9"/>
    <text class="ctx" x="54" y="278">INZGIBA.ME</text>
    <text class="ctx" x="200" y="278">@INZGIBA</text>
    <polygon points="356,267 363,274 356,281 349,274" fill="#00ff88" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
    <text class="ctx" x="370" y="278">SHARD.TEAM</text>
    <rect x="534" y="267" width="18" height="13" rx="2" fill="none" stroke="#ff3e81" stroke-width="1.4"/>
    <polyline points="534,269 543,276 552,269" fill="none" stroke="#ff3e81" stroke-width="1.4"/>
    <text class="ctx" x="560" y="278" fill="#ff8ab5">A.BAKTUBAYEV@GMAIL.COM</text>
  </g>

  <!-- radar + shard decor -->
  <g>
    <circle class="neon" cx="790" cy="130" r="44" stroke-dasharray="12 8" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 790 130" to="360 790 130" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="130" r="28" fill="none" stroke="#16414f" stroke-width="1.2"/>
    <line x1="790" y1="82" x2="790" y2="178" stroke="#16414f" stroke-width="1"/>
    <line x1="742" y1="130" x2="838" y2="130" stroke="#16414f" stroke-width="1"/>
    <polygon points="790,104 816,130 790,156 764,130" fill="none" stroke="#00e5ff" stroke-width="1.6" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 790 130" to="360 790 130" dur="26s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="790,104 816,130 790,130" fill="#00e5ff" opacity="0.22"/>
    <polygon points="790,104 764,130 790,130" fill="#b26bff" opacity="0.20"/>
  </g>
</svg>
