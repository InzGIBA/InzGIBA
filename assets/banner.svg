<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" role="img" aria-label="whoami and stack data card">
  <defs>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .tag  { fill: #0b0906; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .name { fill: #e8dcc0; font-size: 14px; }
      .val  { fill: #9a7b2e; font-size: 13px; }
      .hi   { fill: #ffb000; font-size: 13px; }
      .ft   { fill: #8a6d33; font-size: 12px; }
      .ttl  { fill: #8a6d33; font-size: 12px; letter-spacing: 2px; }
      .sec  { opacity: 0; }
    </style>
  </defs>

  <rect x="6" y="6" width="868" height="340" rx="6" fill="#0b0906" stroke="#4a3b1a" stroke-width="1.5"/>
  <rect x="344" y="0" width="192" height="13" fill="#0b0906"/>
  <text class="ttl" x="440" y="11" text-anchor="middle">almas.baktubayev — whoami</text>

  <!-- WHOAMI -->
  <g class="sec">
    <rect x="32" y="36" width="82" height="22" rx="2" fill="#ffb000"/>
    <text class="tag" x="73" y="51" text-anchor="middle">WHOAMI</text>
    <line x1="126" y1="47" x2="848" y2="47" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.1s" fill="freeze"/>
  </g>

  <g class="sec">
    <text class="name" x="32" y="88">role</text>
    <line x1="70" y1="84" x2="250" y2="84" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="val" x="260" y="88">senior backend engineer</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="120">location</text>
    <line x1="99" y1="116" x2="250" y2="116" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="val" x="260" y="120">Almaty, Kazakhstan</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="152">company</text>
    <line x1="91" y1="148" x2="250" y2="148" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="hi" x="260" y="152">SHARD → shard.team</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- STACK -->
  <g class="sec">
    <rect x="32" y="192" width="72" height="22" rx="2" fill="#ffb000"/>
    <text class="tag" x="68" y="207" text-anchor="middle">STACK</text>
    <line x1="116" y1="203" x2="848" y2="203" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
    <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.1s" fill="freeze"/>
  </g>

  <g class="sec">
    <text class="name" x="32" y="244">backend</text>
    <line x1="91" y1="240" x2="250" y2="240" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="val" x="260" y="244">python · django · fastapi · go</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="276">beyond</text>
    <line x1="77" y1="272" x2="250" y2="272" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="val" x="260" y="276">typescript · vue · flutter · c++</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- footer -->
  <line x1="32" y1="308" x2="848" y2="308" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text class="ft" x="32" y="336">contact <tspan fill="#57451f">··············································</tspan> <tspan fill="#ffb000">inzgiba.me · github/inzgiba · a.baktubayev@gmail.com</tspan></text>
</svg>
