<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="almas@wog terminal: whoami, stack, status, contacts">
  <defs>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .cmd  { fill: #e6edf3; font-size: 17px; }
      .out  { fill: #8b949e; font-size: 17px; }
      .ok   { fill: #3fb950; font-size: 17px; }
      .ps1  { fill: #3fb950; font-size: 17px; }
      .bar  { fill: #6e7681; font-size: 13px; }
      .ctx  { fill: #8b949e; font-size: 13px; }
      .ctxa { fill: #58a6ff; font-size: 13px; }
      .line { opacity: 0; }
      .icon { fill: none; stroke: #6e7681; stroke-width: 1.4; }
    </style>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#161b22"/>
    </pattern>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- terminal window -->
  <rect x="4" y="4" width="872" height="292" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#ds)"/>
  <rect x="5.5" y="47.5" width="869" height="247" rx="0" fill="url(#dots)"/>
  <line x1="4" y1="46" x2="876" y2="46" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="30" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="25" r="6" fill="#27c93f"/>
  <text class="bar" x="440" y="30" text-anchor="middle">almas@wog: ~ (zsh)</text>

  <!-- session -->
  <g>
    <text class="line" x="32" y="82"><tspan class="ps1">$ </tspan><tspan class="cmd">whoami</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line out" x="44" y="108">senior backend engineer · Almaty, KZ
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line" x="32" y="142"><tspan class="ps1">$ </tspan><tspan class="cmd">cat stack.txt</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line out" x="44" y="168">python · django · fastapi · go · typescript · c++
      <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line" x="32" y="202"><tspan class="ps1">$ </tspan><tspan class="cmd">status</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.15s" fill="freeze"/></text>
    <text class="line ok" x="44" y="228">building SHARD → shard.team
      <animate attributeName="opacity" from="0" to="1" begin="5.3s" dur="0.15s" fill="freeze"/></text>
    <rect x="322" y="214" width="10" height="18" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- contacts strip -->
  <line x1="24" y1="252" x2="856" y2="252" stroke="#21262d" stroke-width="1.5"/>
  <g>
    <circle class="icon" cx="38" cy="274" r="7"/>
    <line class="icon" x1="31" y1="274" x2="45" y2="274"/>
    <ellipse class="icon" cx="38" cy="274" rx="3" ry="7"/>
    <text class="ctxa" x="52" y="278">inzgiba.me</text>

    <text class="ctxa" x="196" y="278">@InzGIBA</text>

    <polygon class="icon" points="352,267 359,274 352,281 345,274" fill="#3fb950" stroke="none"/>
    <text class="ctxa" x="366" y="278">shard.team</text>

    <rect class="icon" x="530" y="267" width="18" height="13" rx="2"/>
    <polyline class="icon" points="530,269 539,276 548,269"/>
    <text class="ctxa" x="556" y="278">a.baktubayev@gmail.com</text>
  </g>

  <!-- shard decor -->
  <g opacity="0.9">
    <polygon points="790,74 846,130 790,186 734,130" fill="none" stroke="#30363d" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0 790 130" to="360 790 130" dur="36s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="790,74 846,130 790,130" fill="#58a6ff">
      <animate attributeName="opacity" values="0.10;0.32;0.10" dur="4.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="790,74 734,130 790,130" fill="#388bfd">
      <animate attributeName="opacity" values="0.28;0.08;0.28" dur="4.5s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
