<svg xmlns="http://www.w3.org/2000/svg" width="880" height="576" viewBox="0 0 880 576" role="img" aria-label="Almas Baktubayev: projects and open source contributions, neon HUD">
  <defs>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .head { fill: #00e5ff; font-size: 15px; letter-spacing: 3px; font-weight: 600; }
      .name { fill: #e8f6ff; font-size: 16px; font-weight: 600; }
      .desc { fill: #7a99a8; font-size: 13px; }
      .ossn { fill: #e8f6ff; font-size: 14px; }
      .dim  { fill: #456; font-size: 14px; }
      .cnt  { fill: #7fdcff; font-size: 12px; letter-spacing: 1px; }
      .foot { fill: #2a6b7a; font-size: 11px; letter-spacing: 2px; }
      .row  { opacity: 0; }
      .neon { stroke: #00e5ff; fill: none; stroke-width: 1.5; }
    </style>
    <pattern id="grid2" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#0c1820" stroke-width="1"/>
    </pattern>
    <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#9be8ff" opacity="0.022"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="868" height="564" rx="10" fill="#07090d" stroke="#16414f" stroke-width="1.5"/>
  <rect x="7" y="7" width="866" height="562" fill="url(#grid2)"/>
  <rect x="7" y="7" width="866" height="562" fill="url(#scan2)"/>

  <path class="neon" d="M 22 22 h 18 M 22 22 v 18" opacity="0.85"/>
  <path class="neon" d="M 858 22 h -18 M 858 22 v 18" opacity="0.85"/>
  <path class="neon" d="M 22 554 h 18 M 22 554 v -18" opacity="0.85"/>
  <path class="neon" d="M 858 554 h -18 M 858 554 v -18" opacity="0.85"/>

  <!-- 01 // PROJECTS -->
  <text class="head" x="32" y="52" filter="url(#glow2)">01 // PROJECTS</text>
  <text class="foot" x="848" y="52" text-anchor="end">MODULE.CORE</text>
  <line x1="32" y1="64" x2="848" y2="64" stroke="#16414f" stroke-width="1.5" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" from="0" to="11" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- ReWOG -->
  <g class="row">
    <circle cx="44" cy="96" r="9" fill="none" stroke="#ff8a3d" stroke-width="1.6" filter="url(#glow2)">
      <animate attributeName="r" values="9;7.5;9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <line x1="44" y1="82" x2="44" y2="88" stroke="#ff8a3d" stroke-width="1.6"/>
    <line x1="44" y1="104" x2="44" y2="110" stroke="#ff8a3d" stroke-width="1.6"/>
    <line x1="30" y1="96" x2="36" y2="96" stroke="#ff8a3d" stroke-width="1.6"/>
    <line x1="52" y1="96" x2="58" y2="96" stroke="#ff8a3d" stroke-width="1.6"/>
    <text class="name" x="68" y="92">ReWOG</text>
    <text class="desc" x="68" y="112">world of guns api · reverse engineered the protocol · download, decrypt, unpack 3d models</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.2s" fill="freeze"/>
  </g>

  <!-- cig_config -->
  <g class="row">
    <rect x="36" y="152" width="16" height="16" rx="2" fill="none" stroke="#b26bff" stroke-width="1.6" filter="url(#glow2)"/>
    <line x1="40" y1="148" x2="40" y2="152" stroke="#b26bff" stroke-width="1.6"/>
    <line x1="45" y1="148" x2="45" y2="152" stroke="#b26bff" stroke-width="1.6"/>
    <line x1="50" y1="148" x2="50" y2="152" stroke="#b26bff" stroke-width="1.6"/>
    <line x1="40" y1="168" x2="40" y2="172" stroke="#b26bff" stroke-width="1.6"/>
    <line x1="45" y1="168" x2="45" y2="172" stroke="#b26bff" stroke-width="1.6"/>
    <line x1="50" y1="168" x2="50" y2="172" stroke="#b26bff" stroke-width="1.6"/>
    <text class="name" x="68" y="160">cig_config</text>
    <text class="desc" x="68" y="180">firmware config re tool · xor-xml payload · cigg footer · crc-32/bzip2</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.2s" fill="freeze"/>
  </g>

  <!-- JSON-Resume -->
  <g class="row">
    <path d="M 38 220 h 9 l 5 5 v 15 h -14 z" fill="none" stroke="#00e5ff" stroke-width="1.6" filter="url(#glow2)"/>
    <path d="M 47 220 v 5 h 5" fill="none" stroke="#00e5ff" stroke-width="1.6"/>
    <line x1="41" y1="230" x2="50" y2="230" stroke="#00e5ff" stroke-width="1.6"/>
    <line x1="41" y1="234" x2="50" y2="234" stroke="#00e5ff" stroke-width="1.6"/>
    <text class="name" x="68" y="228">JSON-Resume</text>
    <text class="desc" x="68" y="248">my resume · jsonresume.org format · inzgiba.me</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.2s" fill="freeze"/>
  </g>

  <line x1="32" y1="272" x2="848" y2="272" stroke="#16414f" stroke-width="1.5"/>

  <!-- 02 // OPEN SOURCE -->
  <text class="head" x="32" y="306" filter="url(#glow2)">02 // OPEN SOURCE</text>
  <text class="foot" x="848" y="306" text-anchor="end">PR.COUNT</text>
  <line x1="32" y1="318" x2="848" y2="318" stroke="#16414f" stroke-width="1.5" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" from="0" to="11" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- bar rows: animated neon bars with shimmer sweep -->
  <g class="row">
    <text class="ossn" x="32" y="348">MetaHookSv <tspan class="dim">· C++</tspan></text>
    <rect x="200" y="338" width="0" height="12" rx="6" fill="#ff8a3d" filter="url(#glow2)">
      <animate attributeName="width" from="0" to="330" begin="0.3s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="348" text-anchor="end">40+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="390">django-unfold <tspan class="dim">· PY</tspan></text>
    <rect x="200" y="380" width="0" height="12" rx="6" fill="#00ff88" filter="url(#glow2)">
      <animate attributeName="width" from="0" to="248" begin="0.45s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="390" text-anchor="end">30+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="432">GateCHA <tspan class="dim">· GO</tspan></text>
    <rect x="200" y="422" width="0" height="12" rx="6" fill="#00e5ff" filter="url(#glow2)">
      <animate attributeName="width" from="0" to="206" begin="0.6s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="432" text-anchor="end">25+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="474">checkmygit <tspan class="dim">· TS</tspan></text>
    <rect x="200" y="464" width="0" height="12" rx="6" fill="#b26bff" filter="url(#glow2)">
      <animate attributeName="width" from="0" to="206" begin="0.75s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="474" text-anchor="end">25+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="516">phasmoeditor <tspan class="dim">· TS</tspan></text>
    <rect x="200" y="506" width="0" height="12" rx="6" fill="#ffd166" filter="url(#glow2)">
      <animate attributeName="width" from="0" to="58" begin="0.9s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="516" text-anchor="end">7 PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="558">vibe <tspan class="dim">· TS</tspan></text>
    <rect x="200" y="548" width="0" height="12" rx="6" fill="#ff3e81" filter="url(#glow2)">
      <animate attributeName="width" from="0" to="42" begin="1.05s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="558" text-anchor="end">5 PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.2s" fill="freeze"/>
  </g>
</svg>
