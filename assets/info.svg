<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-label="TUI data panel: projects, open source bars, uptime">
  <defs>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .tag  { fill: #0b0906; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .name { fill: #e8dcc0; font-size: 14px; }
      .desc { fill: #9a7b2e; font-size: 13px; }
      .bar  { fill: #ffb000; }
      .cnt  { fill: #8a6d33; font-size: 12px; }
      .ft   { fill: #8a6d33; font-size: 12px; }
      .ftb  { fill: #ffb000; font-size: 12px; }
      .ttl  { fill: #8a6d33; font-size: 12px; letter-spacing: 2px; }
      .sec  { opacity: 0; }
    </style>
  </defs>

  <rect x="6" y="6" width="868" height="528" rx="6" fill="#0b0906" stroke="#4a3b1a" stroke-width="1.5"/>
  <rect x="348" y="0" width="184" height="13" fill="#0b0906"/>
  <text class="ttl" x="440" y="11" text-anchor="middle">almas.baktubayev — data</text>

  <!-- PROJECTS -->
  <g class="sec">
    <rect x="32" y="40" width="92" height="22" rx="2" fill="#ffb000"/>
    <text class="tag" x="78" y="55" text-anchor="middle">PROJECTS</text>
    <line x1="136" y1="51" x2="848" y2="51" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.1s" fill="freeze"/>
  </g>

  <g class="sec">
    <text class="name" x="32" y="92">ReWOG</text>
    <line x1="82" y1="88" x2="250" y2="88" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="desc" x="260" y="92">world of guns api · download · decrypt · unpack 3d models</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="124">cig_config</text>
    <line x1="112" y1="120" x2="250" y2="120" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="desc" x="260" y="124">firmware re · xor-xml · cigg footer · crc-32/bzip2</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="156">json-resume</text>
    <line x1="118" y1="152" x2="250" y2="152" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="desc" x="260" y="156">jsonresume.org format · inzgiba.me</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- OPEN SOURCE -->
  <g class="sec">
    <rect x="32" y="200" width="132" height="22" rx="2" fill="#ffb000"/>
    <text class="tag" x="98" y="215" text-anchor="middle">OPEN SOURCE</text>
    <line x1="176" y1="211" x2="848" y2="211" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
    <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- bars: hand-written PRs only, log scale -->
  <g class="sec">
    <text class="name" x="32" y="256">django-unfold</text>
    <rect x="180" y="244" width="460" height="12" fill="none" stroke="#3a2f14" stroke-width="1.2"/>
    <rect class="bar" x="180" y="244" width="0" height="12">
      <animate attributeName="width" from="0" to="456" begin="0.9s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="256" text-anchor="end">340+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="296">metahooksv</text>
    <rect x="180" y="284" width="460" height="12" fill="none" stroke="#3a2f14" stroke-width="1.2"/>
    <rect class="bar" x="180" y="284" width="0" height="12">
      <animate attributeName="width" from="0" to="362" begin="1.05s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="296" text-anchor="end">100+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="336">gatecha</text>
    <rect x="180" y="324" width="460" height="12" fill="none" stroke="#3a2f14" stroke-width="1.2"/>
    <rect class="bar" x="180" y="324" width="0" height="12">
      <animate attributeName="width" from="0" to="357" begin="1.2s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="336" text-anchor="end">90+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="376">checkmygit</text>
    <rect x="180" y="364" width="460" height="12" fill="none" stroke="#3a2f14" stroke-width="1.2"/>
    <rect class="bar" x="180" y="364" width="0" height="12">
      <animate attributeName="width" from="0" to="298" begin="1.35s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="376" text-anchor="end">45 PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.25s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="416">phasmoeditor</text>
    <rect x="180" y="404" width="460" height="12" fill="none" stroke="#3a2f14" stroke-width="1.2"/>
    <rect class="bar" x="180" y="404" width="0" height="12">
      <animate attributeName="width" from="0" to="108" begin="1.5s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="416" text-anchor="end">4 PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="456">vibe</text>
    <rect x="180" y="444" width="460" height="12" fill="none" stroke="#3a2f14" stroke-width="1.2"/>
    <rect class="bar" x="180" y="444" width="0" height="12">
      <animate attributeName="width" from="0" to="108" begin="1.65s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="456" text-anchor="end">4 PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.1s" fill="freeze"/>
  </g>

  <!-- footer -->
  <line x1="32" y1="488" x2="848" y2="488" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text class="ft" x="32" y="514">count <tspan fill="#57451f">·····</tspan> hand-written PRs only, automation excluded <tspan fill="#57451f">·····</tspan> uptime <tspan class="ftb">9 years in production</tspan></text>
</svg>
