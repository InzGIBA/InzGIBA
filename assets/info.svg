<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" role="img" aria-label="TUI data panel: projects">
  <defs>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .tag  { fill: #0b0906; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .name { fill: #e8dcc0; font-size: 14px; }
      .desc { fill: #9a7b2e; font-size: 13px; }
      .ft   { fill: #8a6d33; font-size: 12px; }
      .ftb  { fill: #ffb000; font-size: 12px; }
      .ttl  { fill: #8a6d33; font-size: 12px; letter-spacing: 2px; }
      .sec  { opacity: 0; }
    </style>
  </defs>

  <rect x="6" y="6" width="868" height="236" rx="6" fill="#0b0906" stroke="#4a3b1a" stroke-width="1.5"/>
  <rect x="348" y="0" width="184" height="13" fill="#0b0906"/>
  <text class="ttl" x="440" y="11" text-anchor="middle">almas.baktubayev — data</text>

  <g class="sec">
    <rect x="32" y="36" width="92" height="22" rx="2" fill="#ffb000"/>
    <text class="tag" x="78" y="51" text-anchor="middle">PROJECTS</text>
    <line x1="136" y1="47" x2="848" y2="47" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.1s" fill="freeze"/>
  </g>

  <g class="sec">
    <text class="name" x="32" y="88">ReWOG</text>
    <line x1="82" y1="84" x2="250" y2="84" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="desc" x="260" y="88">world of guns api · download · decrypt · unpack 3d models</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="120">cig_config</text>
    <line x1="112" y1="116" x2="250" y2="116" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="desc" x="260" y="120">firmware re · xor-xml · cigg footer · crc-32/bzip2</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.1s" fill="freeze"/>
  </g>
  <g class="sec">
    <text class="name" x="32" y="152">json-resume</text>
    <line x1="118" y1="148" x2="250" y2="148" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="1.5 5"/>
    <text class="desc" x="260" y="152">jsonresume.org format · inzgiba.me</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.1s" fill="freeze"/>
  </g>

  <line x1="32" y1="184" x2="848" y2="184" stroke="#4a3b1a" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text class="ft" x="32" y="212">uptime <tspan fill="#57451f">············································································</tspan> <tspan class="ftb">9 years in production</tspan></text>
</svg>
