<svg xmlns="http://www.w3.org/2000/svg" width="880" height="576" viewBox="0 0 880 576" role="img" aria-label="Almas Baktubayev: projects and open source contributions">
  <defs>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .head { fill: #6e7681; font-size: 14px; letter-spacing: 2px; }
      .name { fill: #e6edf3; font-size: 16px; font-weight: 600; }
      .desc { fill: #8b949e; font-size: 13px; }
      .ossn { fill: #e6edf3; font-size: 14px; }
      .dim  { fill: #6e7681; font-size: 14px; }
      .cnt  { fill: #8b949e; font-size: 12px; }
      .icon { fill: none; stroke-width: 1.6; }
      .row  { opacity: 0; }
    </style>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#161b22"/>
    </pattern>
    <filter id="ds2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="872" height="568" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#ds2)"/>
  <rect x="5.5" y="5.5" width="869" height="565" fill="url(#dots2)"/>

  <!-- 01 / PROJECTS -->
  <text class="head" x="32" y="52"><tspan fill="#58a6ff">01 /</tspan> PROJECTS</text>
  <line x1="32" y1="64" x2="848" y2="64" stroke="#21262d" stroke-width="1.5"/>

  <!-- ReWOG -->
  <g class="row">
    <circle class="icon" cx="44" cy="96" r="9" stroke="#f78166"/>
    <line class="icon" x1="44" y1="83" x2="44" y2="89" stroke="#f78166"/>
    <line class="icon" x1="44" y1="103" x2="44" y2="109" stroke="#f78166"/>
    <line class="icon" x1="31" y1="96" x2="37" y2="96" stroke="#f78166"/>
    <line class="icon" x1="51" y1="96" x2="57" y2="96" stroke="#f78166"/>
    <text class="name" x="68" y="92">ReWOG</text>
    <text class="desc" x="68" y="112">world of guns api · reverse engineered the protocol · download, decrypt, unpack 3d models</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.2s" fill="freeze"/>
  </g>

  <!-- cig_config -->
  <g class="row">
    <rect class="icon" x="36" y="152" width="16" height="16" rx="2" stroke="#d2a8ff"/>
    <line class="icon" x1="40" y1="149" x2="40" y2="152" stroke="#d2a8ff"/>
    <line class="icon" x1="45" y1="149" x2="45" y2="152" stroke="#d2a8ff"/>
    <line class="icon" x1="50" y1="149" x2="50" y2="152" stroke="#d2a8ff"/>
    <line class="icon" x1="40" y1="168" x2="40" y2="171" stroke="#d2a8ff"/>
    <line class="icon" x1="45" y1="168" x2="45" y2="171" stroke="#d2a8ff"/>
    <line class="icon" x1="50" y1="168" x2="50" y2="171" stroke="#d2a8ff"/>
    <text class="name" x="68" y="160">cig_config</text>
    <text class="desc" x="68" y="180">firmware config re tool · xor-xml payload · cigg footer · crc-32/bzip2</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.2s" fill="freeze"/>
  </g>

  <!-- JSON-Resume -->
  <g class="row">
    <path class="icon" d="M 38 148 h 9 l 5 5 v 15 h -14 z" stroke="#58a6ff"/>
    <path class="icon" d="M 47 148 v 5 h 5" stroke="#58a6ff"/>
    <line class="icon" x1="41" y1="158" x2="50" y2="158" stroke="#58a6ff"/>
    <line class="icon" x1="41" y1="162" x2="50" y2="162" stroke="#58a6ff"/>
    <text class="name" x="68" y="228">JSON-Resume</text>
    <text class="desc" x="68" y="248">my resume · jsonresume.org format · inzgiba.me</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.2s" fill="freeze"/>
  </g>

  <line x1="32" y1="272" x2="848" y2="272" stroke="#21262d" stroke-width="1.5"/>

  <!-- 02 / OPEN SOURCE -->
  <text class="head" x="32" y="306"><tspan fill="#58a6ff">02 /</tspan> OPEN SOURCE</text>
  <line x1="32" y1="318" x2="848" y2="318" stroke="#21262d" stroke-width="1.5"/>

  <!-- rows: name ·lang | animated bar | count -->
  <g class="row">
    <text class="ossn" x="32" y="348">MetaHookSv <tspan class="dim">· c++</tspan></text>
    <rect x="200" y="338" width="0" height="12" rx="6" fill="#f78166">
      <animate attributeName="width" from="0" to="330" begin="0.3s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="348" text-anchor="end">40+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="390">django-unfold <tspan class="dim">· py</tspan></text>
    <rect x="200" y="380" width="0" height="12" rx="6" fill="#3fb950">
      <animate attributeName="width" from="0" to="248" begin="0.45s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="390" text-anchor="end">30+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="432">GateCHA <tspan class="dim">· go</tspan></text>
    <rect x="200" y="422" width="0" height="12" rx="6" fill="#58a6ff">
      <animate attributeName="width" from="0" to="206" begin="0.6s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="432" text-anchor="end">25+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="474">checkmygit <tspan class="dim">· ts</tspan></text>
    <rect x="200" y="464" width="0" height="12" rx="6" fill="#d2a8ff">
      <animate attributeName="width" from="0" to="206" begin="0.75s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="474" text-anchor="end">25+ PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="516">phasmoeditor <tspan class="dim">· ts</tspan></text>
    <rect x="200" y="506" width="0" height="12" rx="6" fill="#ffa657">
      <animate attributeName="width" from="0" to="58" begin="0.9s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="516" text-anchor="end">7 PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.2s" fill="freeze"/>
  </g>
  <g class="row">
    <text class="ossn" x="32" y="558">vibe <tspan class="dim">· ts</tspan></text>
    <rect x="200" y="548" width="0" height="12" rx="6" fill="#f778ba">
      <animate attributeName="width" from="0" to="42" begin="1.05s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text class="cnt" x="848" y="558" text-anchor="end">5 PRs</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.2s" fill="freeze"/>
  </g>
</svg>
