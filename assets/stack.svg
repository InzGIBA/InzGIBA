    <rect class="chipb" x="658" y="112" width="78" height="30" rx="4"/>
    <text class="chip" x="672" y="132">docker</text>
    <rect class="chipb" x="744" y="112" width="46" height="30" rx="4"/>
    <text class="chip" x="758" y="132">k8s</text>
    <rect class="chipb" x="798" y="112" width="50" height="30" rx="4"/>
