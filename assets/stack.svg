    <rect class="chipb" x="355" y="112" width="112" height="30" rx="4"/>
    <text class="chip" x="369" y="132">typescript</text>
    <rect class="chipb" x="475" y="112" width="54" height="30" rx="4"/>
    <text class="chip" x="489" y="132">vue</text>
    <rect class="chipb" x="355" y="150" width="58" height="30" rx="4"/>
    <text class="chip" x="369" y="170">next</text>
