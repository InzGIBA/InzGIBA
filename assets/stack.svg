<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" aria-label="Stack: backend, frontend, devops, homelab">
  <defs>
    <style>
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Liberation Mono', Menlo, Consolas, monospace; }
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .chipb { fill: #0d1117; stroke: #30363d; }
      .tick { stroke: #30363d; }
      .k { fill: #8b949e; font-size: 11px; letter-spacing: 2.2px; }
      .chip { fill: #e6edf3; font-size: 13px; }
      .gold { fill: #d29922; }
      .frame { stroke: #30363d; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
      }
    </style>
  </defs>

  <rect class="bg frame" x="1" y="1" width="958" height="290" rx="18" stroke-width="1.25"/>
  <g class="tick" fill="none" stroke-width="1.25">
    <path d="M22 22 H38 M22 22 V38"/>
    <path d="M938 22 H922 M938 22 V38"/>
    <path d="M22 270 H38 M22 270 V254"/>
    <path d="M938 270 H922 M938 270 V254"/>
  </g>

  <rect x="32" y="34" width="8" height="8" rx="1" class="gold">
    <animate class="motion" attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text class="k gold" x="50" y="43">STACK</text>
  <text class="k" x="928" y="43" text-anchor="end">FULL-STACK · DEVOPS</text>

